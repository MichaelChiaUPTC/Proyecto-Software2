services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-uptc}
      MYSQL_USER: ${DB_USER:-uptc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-uptc_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - uptc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-uptc}
      DB_PASSWORD: ${DB_PASSWORD:-uptc_dev}
      DB_NAME: ${DB_NAME:-uptc}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  uptc_mysql_data:
