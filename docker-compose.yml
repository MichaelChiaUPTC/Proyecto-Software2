services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-uptc}
      MYSQL_USER: ${DB_USER:-uptc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-uptc_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - uptc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-uptc}
      DB_PASSWORD: ${DB_PASSWORD:-uptc_dev}
      DB_NAME: ${DB_NAME:-uptc}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-python:3.12-alpine}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
    # RIESGO: acceso al socket de Docker = control del host. Mitigaciones en docs/BITACORA.md (Fase 3).
    # La imagen del runner debe estar descargada en el host: docker pull python:3.12-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # El usuario node necesita pertenecer al grupo dueño del socket: GID 0 en Docker Desktop; en Linux,
    # el del grupo docker (`stat -c %g /var/run/docker.sock`).
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "${API_PORT:-3000}:3000"

  # Automatizacion de correos (Fase 4). No arranca por defecto: docker compose --profile automatizacion up -d n8n
  # Editor en http://localhost:5678. Ver n8n/README.md para importar los workflows y crear las credenciales
  # (MySQL: host mysql, base uptc; SMTP: el del correo que envia).
  n8n:
    image: n8nio/n8n:latest
    profiles: [automatizacion]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_SECURE_COOKIE: "false" # solo desarrollo local por http; en produccion va detras de HTTPS
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - uptc_n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro # para importar: n8n import:workflow --input=/workflows/<archivo>.json

volumes:
  uptc_mysql_data:
  uptc_n8n_data:
