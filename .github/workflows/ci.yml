name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYSQL_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Las pruebas del DockerRunner usan el Docker del runner (ubuntu-latest lo trae); sin él: SKIP_DOCKER_TESTS=1
      - run: docker pull python:3.12-alpine
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # E2E (Playwright + axe) contra la API real de docker compose. Tambien regenera las capturas y el informe de accesibilidad.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-secreto-largo-para-pruebas-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker pull python:3.12-alpine
      - name: Levantar MySQL y la API
        run: |
          # En ubuntu-latest el socket de Docker pertenece al grupo docker (no al GID 0 de Docker Desktop)
          export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
          docker compose up -d --build mysql api
          for i in $(seq 1 40); do curl -fs http://localhost:3000/api/health && exit 0; sleep 3; done
          docker compose logs api
          exit 1
      - name: Datos demo (seed)
        run: npm ci && npm run seed
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-informe
          path: |
            e2e/playwright-report
            e2e/test-results
            docs/evidencias/accesibilidad.md
            docs/evidencias/capturas
